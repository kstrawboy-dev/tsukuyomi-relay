name: Build Android Payload APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
  runs-on: ubuntu-latest

  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build APK with Gradle
      run: |
        chmod +x gradlew || echo "No gradlew found"
        # Inga ungaloda actual build command varum (e.g., ./gradlew assembleRelease)
        echo "Building APK package..."
        mkdir -p build/output
        echo "Dummy compiled APK stream" > build/output/payload_release.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tsukuyomi-Payload-APK
        path: build/output/*.apk
        
